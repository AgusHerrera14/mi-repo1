version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluecorp-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - bluecorp_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/bluecorp.db
      - SECRET_KEY=${SECRET_KEY:-bluecorp-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bluecorp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    restart: unless-stopped

volumes:
  bluecorp_data:
